<title>Ballo Adventure</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{--red:#e8323c;--ink:#5b2a3c}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{position:fixed;inset:0;width:100%;height:100%;margin:0;background:#62bdfc;overflow:hidden;font-family:'Fredoka','Trebuchet MS',system-ui,sans-serif;color:var(--ink);-webkit-user-select:none;user-select:none}
#stage{position:absolute;inset:0;overflow:hidden;font-size:min(calc(100vh*16/540),calc(100vw/60))}
@supports(height:100dvh){#stage{font-size:min(calc(100dvh*16/540),calc(100vw/60))}}
canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
.ov{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:.9em;padding:1em}
h1{margin:0 0 .3em;font-size:6.4em;font-weight:700;color:#fff;letter-spacing:.03em;-webkit-text-stroke:.12em var(--red);paint-order:stroke fill;text-shadow:0 .06em 0 #a81f2e,0 .12em 0 #a81f2e,0 .3em .5em #5b2a3c66;transform:rotate(-2deg);line-height:1;text-align:center}
button{--sd:#a81f2e;position:relative;overflow:hidden;font:inherit;font-weight:700;cursor:pointer;border:0;border-radius:2em;padding:.5em 2em;font-size:1.6em;color:#fff;background:linear-gradient(#ff6a73,#e8323c);box-shadow:0 .2em 0 var(--sd),0 .5em .8em #5b2a3c40;transition:transform .4s cubic-bezier(.34,1.8,.5,1),box-shadow .2s,filter .2s}
button::after{content:'';position:absolute;top:-20%;left:-60%;width:40%;height:140%;background:linear-gradient(100deg,transparent,#ffffff88,transparent);transform:skewX(-22deg);pointer-events:none}
@media(hover:hover){button:hover{transform:translateY(-.14em) scale(1.07);filter:brightness(1.07);box-shadow:0 .34em 0 var(--sd),0 .8em 1.1em #5b2a3c45}button:hover::after{animation:shine .75s ease}}
button:active{transform:translateY(.12em) scale(1.05,.9);box-shadow:0 .06em 0 var(--sd);transition-duration:.08s}
button.pop{animation:jelly .55s}
button:focus-visible{outline:.2em solid #fff}
#dl{font-size:2em;padding:.45em 2.6em;animation:breathe 2.4s ease-in-out infinite}
#dl:hover{animation:none}
#dl.done{--sd:#2f9c46;background:linear-gradient(#7be08a,#3dbb55)}
.ic{width:1em;height:1em;vertical-align:-.14em;margin-right:.45em;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
@keyframes breathe{50%{transform:scale(1.05)}}
@keyframes shine{to{left:130%}}
@keyframes jelly{0%{transform:scale(1.14,.84)}30%{transform:scale(.92,1.12)}55%{transform:scale(1.05,.96)}80%{transform:scale(.99,1.01)}100%{transform:scale(1)}}
</style></head><body>

const C=document.getElementById('c'),g=C.getContext('2d'),H=540,G=470,S={quality:2};
let W=960,SC=1,M=1300,t=0,cam=0;
const hs=n=>{const v=Math.sin(n*127.1)*43758.5;return v-Math.floor(v)};
function cloudB(x,y,s){for(const[dy,col]of[[7,'#d8ecfb'],[0,'#fff']]){g.fillStyle=col;g.beginPath();g.arc(x,y+dy*s,22*s,0,7);g.arc(x+26*s,y-10*s+dy*s,28*s,0,7);g.arc(x+56*s,y+dy*s,22*s,0,7);g.arc(x+28*s,y+8*s+dy*s,24*s,0,7);g.fill()}}
function layer(off,col,amp,base,wl,tc,sp){const f=u=>base+Math.sin(u/wl)*amp+Math.sin(u/(wl*.43))*amp*.35;g.fillStyle=col;g.beginPath();g.moveTo(0,H);for(let x=0;x<=W;x+=10)g.lineTo(x,f(x+off));g.lineTo(W,H);g.fill();if(tc){const i0=Math.floor(off/sp);for(let i=i0-1;i<i0+W/sp+2;i++){const u=i*sp+hs(i)*50,x=u-off;if(hs(i+7)<.35)continue;const s=.8+hs(i+3)*.6;g.fillStyle=tc;g.fillRect(x-3*s,f(u)-4,6*s,16*s);g.beginPath();g.arc(x,f(u)-10*s,17*s,0,7);g.arc(x-11*s,f(u)-2*s,12*s,0,7);g.arc(x+11*s,f(u)-2*s,12*s,0,7);g.fill()}}}
function bg(c){const gr=g.createLinearGradient(0,0,0,H);gr.addColorStop(0,'#62bdfc');gr.addColorStop(.55,'#bde8ff');gr.addColorStop(1,'#ffeccf');g.fillStyle=gr;g.fillRect(0,0,W,H);
 const sg=g.createRadialGradient(W-180,100,10,W-180,100,230);sg.addColorStop(0,'#fffbd8');sg.addColorStop(.3,'#fff6b0aa');sg.addColorStop(1,'#fff6b000');g.fillStyle=sg;g.fillRect(W-480,0,480,350);
 if(S.quality>0){g.save();g.translate(W-180,100);g.rotate(t*.002);g.fillStyle='#ffffff16';for(let i=0;i<8;i++){g.rotate(Math.PI/4);g.beginPath();g.moveTo(0,0);g.lineTo(700,-70);g.lineTo(700,70);g.fill()}g.restore()}
 g.fillStyle='#fffcd6';g.beginPath();g.arc(W-180,100,40,0,7);g.fill();
 for(let i=0;i<7;i++){const x=((i*340-c*.12+t*.25)%2380+2380)%2380-220;cloudB(x,60+(i%3)*55,.9+(i%2)*.45)}
 layer(c*.2,'#b4e8cf',46,350,190,null,1);layer(c*.35+200,'#8fdcab',40,400,150,'#6fcb92',150);layer(c*.55+500,'#69cc82',26,445,110,'#4bb76a',120);
 if(S.quality>1)for(let i=0;i<14;i++){const x=((hs(i)*M-t*(.3+hs(i+3)*.5)-c*.4)%M+M)%M-150,y=60+hs(i+5)*360+Math.sin(t*.03+i)*18;g.fillStyle=i%3?'#ffffffb0':'#ffc4d8c0';g.beginPath();g.ellipse(x,y,4,2.4,t*.02+i,0,7);g.fill()}}
function flower(x,y,col){g.strokeStyle='#3fa655';g.lineWidth=2;g.beginPath();g.moveTo(x,y+4);g.lineTo(x,y-12);g.stroke();g.fillStyle=col;for(let k=0;k<5;k++){g.beginPath();g.arc(x+Math.cos(k*1.2566)*4.5,y-14+Math.sin(k*1.2566)*4.5,3.4,0,7);g.fill()}g.fillStyle='#ffd84a';g.beginPath();g.arc(x,y-14,3,0,7);g.fill()}
function gseg(s,x){x=Math.round(x);const y=s[1],w=s[2];if(x>W||x+w<0)return;
 const a=Math.max(0,Math.floor(-x/52)),bI=Math.min(Math.floor(w/52),Math.ceil((W-x)/52));
 const dg=g.createLinearGradient(0,y,0,H);dg.addColorStop(0,'#f7c98f');dg.addColorStop(1,'#d8935a');g.fillStyle=dg;rr(x,y,w,H-y+20,[10,10,0,0]);g.fill();
 g.fillStyle='#ffffff30';g.beginPath();for(let i=a;i<bI;i++){const cx=x+26+i*52,cy=y+44+(i%3)*14;g.moveTo(cx+5+(i%2)*2,cy);g.arc(cx,cy,5+(i%2)*2,0,7)}g.fill();
 g.fillStyle='#55bf5e';g.beginPath();const a2=Math.max(0,Math.floor(-x/20)),b2=Math.min(Math.floor(w/20),Math.ceil((W-x)/20));for(let i=a2;i<b2;i++){g.moveTo(x+i*20,y+16);g.arc(x+10+i*20,y+16,10,Math.PI,0,true)}g.fill();
 rr(x,y-6,w,22,[12,12,0,0]);g.fill();g.fillStyle='#86e07c';rr(x+2,y-6,w-4,10,[8,8,4,4]);g.fill();
 for(let wx=Math.ceil((s[0]+10)/34)*34;wx<s[0]+w-10;wx+=34){const h=hs(wx*.37),px=wx-cam;if(px<-20||px>W+20)continue;if(h>.72)flower(px,y-3,['#ff8fb1','#ffffff','#ffd45e','#b69cff'][Math.floor(h*40)%4]);else if(h>.3){g.strokeStyle='#3da34f';g.lineWidth=2;g.beginPath();for(const d of[-4,0,4]){g.moveTo(px+d,y-3);g.lineTo(px+d*1.8,y-11)}g.stroke()}}}
